kind = "web"
previewPath = "/"
title = "Mint Sorter & Parser"
version = "1.0.0"
id = "artifacts/mint-pdf-sorter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20707

[services.development]
run = "pnpm --filter @workspace/mint-pdf-sorter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mint-pdf-sorter", "run", "build" ]
publicDir = "artifacts/mint-pdf-sorter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20707"
BASE_PATH = "/"
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mint Sorter & Parser API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: process
    description: PDF processing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /process:
    post:
      operationId: processFiles
      tags: [process]
      summary: Sort PDF files or parse store export CSV files
      description: Upload files (multipart/form-data) with a preset; returns a job ID and output file list
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProcessInput"
      responses:
        "200":
          description: Processing complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /spreadsheet/inspect:
    post:
      operationId: inspectSpreadsheet
      tags: [process]
      summary: Preview spreadsheet sheets and rows for column mapping
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SpreadsheetInspectInput"
      responses:
        "200":
          description: Spreadsheet preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpreadsheetInspectResult"
        "400":
          description: Spreadsheet could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /jobs/{jobId}/files/{key}:
    get:
      operationId: downloadFile
      tags: [process]
      summary: Download a processed output file
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Job or file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProcessInput:
      type: object
      required:
        - preset
      properties:
        preset:
          type: string
          enum: [combine_labels, sort_slips, sort_slips_name, sort_slips_custom, sort_slips_custom_first, sort_labels, sort_both, match_labels, custom_sort, required_field, split_required_field, spreadsheet_sequence, parse_store_export]
          description: Processing preset
        sort_fields:
          type: string
          description: "JSON array of sort field names used when preset is custom_sort. Available fields: last_name, first_name, style, size, color, custom_field, delivery_method, location, sort_number, order_number, order_date"
        single_line_item_first:
          type: boolean
          default: false
          description: Put single-product-line orders before multi-line orders while retaining the selected sequence within each group. Applies within each birth-year batch. Not supported for combine_labels, match_labels, or parse_store_export.
        preferred_style:
          type: string
          maxLength: 100
          description: Optional exact style used to select the first matching product across an order for product sorting. Falls back to the first product.
        preferred_color:
          type: string
          maxLength: 100
          description: Optional exact color restricting the preferred-style match; requires preferred_style. Matching ignores capitalization and extra whitespace.
        spreadsheet_mapping:
          type: string
          description: JSON column mapping used by the spreadsheet_sequence preset
        remove_column_indexes:
          type: string
          description: JSON array of additional zero-based CSV column indexes removed by the parse_store_export preset

    SpreadsheetInspectInput:
      type: object
      required: [spreadsheet]
      properties:
        spreadsheet:
          type: string
          description: CSV or XLSX spreadsheet upload

    SpreadsheetPreviewSheet:
      type: object
      required: [name, rows]
      properties:
        name:
          type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string

    SpreadsheetInspectResult:
      type: object
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/SpreadsheetPreviewSheet"

    OutputFile:
      type: object
      required: [key, filename, label, mime]
      properties:
        key:
          type: string
        filename:
          type: string
        label:
          type: string
        mime:
          type: string

    ProcessResult:
      type: object
      required: [jobId, outputs, warnings]
      properties:
        jobId:
          type: string
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/OutputFile"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/SortWarning"

    SortWarning:
      type: object
      required: [sourcePages, orderNumber, missingFields, message]
      properties:
        sourcePages:
          type: array
          items:
            type: integer
            minimum: 1
        orderNumber:
          type: string
        missingFields:
          type: array
          items:
            type: string
        message:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
